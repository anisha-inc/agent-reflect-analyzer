[project]
name = "agent-reflect-analyzer"
version = "0.3.0"
description = "Reads shipped Claude Code sessions from GCS, runs C+D hybrid LLM analysis, emits improvement issues."
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
dependencies = [
  "click>=8.1",
  "duckdb>=0.10",
  "jinja2>=3.1",
  "semhash>=0.2",
  "presidio-analyzer>=2.2",
  "presidio-anonymizer>=2.2",
  "sentence-transformers>=2.6",
  "scikit-learn>=1.4",
  "anthropic>=0.40",
  "httpx>=0.27",
  "tenacity>=8.2",
  "pydantic>=2.5",
  "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=4.1",
  "pytest-socket>=0.7",
  "ruff>=0.6",
]

[project.scripts]
analyzer-cli = "analyzer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["analyzer"]

[tool.hatch.build.targets.wheel.force-include]
"analyzer/llm/prompts" = "analyzer/llm/prompts"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"analyzer/subprocess_util.py" = ["S603", "S607"]
# DuckDB glob is a constant from config; the only dynamic value is a bound param.
"analyzer/duckdb_query.py" = ["S608"]
"tests/**" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
addopts = "--disable-socket --allow-unix-socket"
